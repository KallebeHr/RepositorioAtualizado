name: Preparar pacotes privados
on:
  workflow_dispatch:
    inputs:
      prepare_groups:
        type: boolean
        default: false
        description: Antecipar pacotes por cantor, gênero e mês
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: repertorio-package-worker
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      FIREBASE_ADMIN_CREDENTIALS_JSON: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_JSON }}
      STORAGE_PROVIDER: r2
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      LEGACY_MEDIA_HOSTS: ${{ vars.LEGACY_MEDIA_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificar configuração
        id: config
        run: |
          if [ -n "$FIREBASE_ADMIN_CREDENTIALS_JSON" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ENDPOINT" ] && [ -n "$R2_ACCESS_KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Configuração do Firebase/R2 pendente. Nenhum arquivo será alterado."
          fi
      - if: steps.config.outputs.ready == 'true'
        run: npm ci --omit=dev
      - if: steps.config.outputs.ready == 'true' && inputs.prepare_groups != true
        run: npm run packages:worker
      - if: steps.config.outputs.ready == 'true' && inputs.prepare_groups == true
        run: npm run packages:worker -- --prepare
